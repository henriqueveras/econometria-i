<text x="370" y="245" text-anchor="middle" font-size="14" fill="#854F0B">endogenous</text>
<rect x="560" y="200" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
