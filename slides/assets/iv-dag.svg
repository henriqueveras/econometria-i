<text x="150" y="140" text-anchor="start" font-size="15" fill="#A32D2D">Z &#8869; U&#160;&#160;(exogeneity)</text>
<line x1="452" y1="114" x2="384" y2="198" stroke="#888780" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#ivarrow)"/>
